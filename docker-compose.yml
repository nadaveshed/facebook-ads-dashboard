services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ads-db
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ads-network

  # Python Scraper Service
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: ads-scraper
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      # Use the internal docker network host "db"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ASSETS_DIR: /app/assets
    volumes:
      - ./assets:/app/assets
    networks:
      - ads-network

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ads-backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      # Use the internal docker network host "db"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: ${PORT}
      ASSETS_DIR: /app/assets
    volumes:
      - ./assets:/app/assets
    ports:
      - "3001:3001"
    networks:
      - ads-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ads-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - ads-network

volumes:
  postgres_data:


networks:
  ads-network:
    driver: bridge
